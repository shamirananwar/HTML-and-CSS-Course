
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academy Cinemas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Academy Cinemas</a>
      <a class="text-white" href="#movies">Movies</a>
    </div>
  </nav>

  <header class="bg-primary text-white text-center p-5">
    <h1>Welcome to Academy Cinemas</h1>
    <p>Enjoy the latest movies!</p>
  </header>

  <section id="movies" class="container my-5">
    <h2>Now Showing</h2>
    <div class="row g-3">
      <div class="col-md-4">
        <div class="card p-3">
          <h3>Action Movie</h3>
          <p>Experience an exciting adventure!</p>
          <button class="btn btn-primary">Showtimes</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3">
          <h3>Comedy Movie</h3>
          <p>Enjoy a fun movie with friends!</p>
          <button class="btn btn-primary">Showtimes</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3">
          <h3>Family Movie</h3>
          <p>A great movie for everyone!</p>
          <button class="btn btn-primary">Showtimes</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center p-4">
    <p class="mb-0">&copy; 2026 Academy Cinemas</p>
  </footer>
</body>
</html>
